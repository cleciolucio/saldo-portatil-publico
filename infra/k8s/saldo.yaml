apiVersion: apps/v1
kind: Deployment
metadata:
  name: saldo-web
  namespace: saldo-qa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saldo-web
  template:
    metadata:
      labels:
        app: saldo-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web
          image: saldo-qa:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: saldo-web
  namespace: saldo-qa
spec:
  type: NodePort
  selector:
    app: saldo-web
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
